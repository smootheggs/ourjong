<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the table run under notches; the app pads for them itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ourjong</title>
    <meta name="description" content="Hong Kong Old Style Mahjong. Play offline." />

    <!-- Colours for the status bar, task switcher and splash screen. -->
    <meta name="theme-color" content="#0a241c" />
    <meta name="color-scheme" content="dark" />

    <!-- Installed-app behaviour. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ourjong" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Icons. The web app manifest itself is added by vite-plugin-pwa at build time. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
